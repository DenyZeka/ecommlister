<!DOCTYPE html>
<html>
<head>
  <title>EcommLister</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 350px; /* Or desired width */
      padding: 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .data-item {
      border: 1px solid #eee;
      padding: 8px;
      border-radius: 4px;
    }
    .data-item strong {
      display: block;
      margin-bottom: 4px;
      color: #333;
    }
    .data-item span {
      word-wrap: break-word;
    }
    .button-group {
      display: flex;
      gap: 8px;
      justify-content: space-around;
      margin-top: 10px;
    }
    button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 5px;
      font-style: italic;
      color: #666;
    }
    .loader {
      border: 4px solid #f3f3f3; /* Light grey */
      border-top: 4px solid #3498db; /* Blue */
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      margin: 5px auto;
      display: none; /* Hidden by default */
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>EcommLister</h3>

    <button id="fetchDetailsButton">Fetch Product Details</button>
    <div id="loader" class="loader"></div>
    <div id="statusMessage" class="status"></div>

    <div id="productDetails" style="display: none;">
      <div class="data-item">
        <strong>Title:</strong> <span id="productTitle"></span>
      </div>
      <div class="data-item">
        <strong>SKU:</strong> <span id="productSku"></span>
      </div>
      <div class="data-item">
        <strong>Price:</strong> <span id="productPrice"></span>
      </div>
      <!-- Add more placeholders as needed for description, images (maybe a count or small thumbs), variations -->
    </div>

    <div class="button-group">
      <button id="bulkAddButton" disabled>Add to Bulk List</button>,
      <button id="listEbayButton" disabled>List on eBay</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
